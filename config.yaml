experiment:
  name: fl_mobilevit_nigeria_cxr
  seed: 42
  output_dir: artifacts
data:
  kaggle_handle: aminumusa/nigeria-chest-x-ray-dataset
  root: null
  image_size: 256
  train_fraction: 0.70
  val_fraction: 0.15
  test_fraction: 0.15
  clahe_clip_limit: 2.0
  clahe_grid_size: 8
model:
  name: mobilevit_xs
  pretrained: true
  num_classes: 4
training:
  batch_size: 32
  local_epochs: 3
  rounds: 50
  learning_rate: 0.0001
  weight_decay: 0.01
  num_workers: 0
federated:
  clients: 5
  dirichlet_alpha: 0.5
  partition_seed: 123
privacy:
  enabled: false
  max_grad_norm: 0.5
  noise_multiplier: 1.1
  delta: 0.00001

